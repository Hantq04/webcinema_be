server:
  port: 8080
  ssl:
    enabled: false
spring:
  application:
    name: WebCinema
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${server.db.endpoint}:${server.db.port}/${server.db.name}?useSSL=false&serverTimezone=UTC
    username: ${server.db.username}
    password: ${server.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    open-in-view: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
      data-locations: classpath:/database/data.sql
  messages:
    basename: i18n/messages
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${dev.mail.username}
    password: ${dev.mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      host: localhost
      port: 6379
      password: redis
      timeout: 60000
  main:
    allow-bean-definition-overriding: true
application:
  jwt:
    secret: TmfDtCBUcuG6p24gUXVhbmcgSMOgIC0gNC8xMS8yMDA0IC0gSEQ=
    expiration: 86400000
    refresh-token:
      expiration: 172800000
  email:
    verify-expiration: 300000